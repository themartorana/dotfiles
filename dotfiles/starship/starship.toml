# Starship prompt config, linked to ~/.config/starship.toml by setup.sh.
# Based on the Pure preset (https://starship.rs/presets/pure-preset),
# as generated by `starship preset pure-preset` (starship 1.27.0).
# Note: the git_status and jj_status symbols below are zero-width spaces (U+200B).
#
# Changes from the preset (everything else is Pure as generated):
#   - scan_timeout
#   - format: ${env_var.SSH_CONNECTION} and ${env_var.MACHINE_NAME} added
#   - [directory]: full ~ path, repo folder in bold
#   - the [username], [hostname] and [env_var.*] tables at the bottom

# Top-level keys must come before any [table].
# Raised from the default 30ms to avoid "Scanning current directory timed
# out" warnings in large directories.
scan_timeout = 500

"$schema" = 'https://starship.rs/config-schema.json'

format = """
${env_var.SSH_CONNECTION}\
$username\
${env_var.MACHINE_NAME}\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"
# Ours: full path from ~ (like Pure itself) with the repo folder in bold.
# If paths get unruly, fish_style_pwd_dir_length = 1 (and dropping the two
# truncation lines) gives ~/.h/w/d/repo instead.
truncation_length = 0
truncate_to_repo = false
before_repo_root_style = "blue"
repo_root_style = "bold blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[jj_bookmark]
format = "[$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
style = "bright-black"

[jj_status]
format = "[[(*$all)](218)]($style)"
style = "cyan"
conflicted = "​"
description_empty = ""
description_present = ""
hidden = "​"
immutable = "​"
added = "​"
copied = ""
deleted = "​"
modified = "​"
renamed = "​"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

# --- Machine name: always show user@machine, so you know where you are ---
# The machine is $MACHINE_NAME if set (export it in ~/.profile.local),
# otherwise the short hostname. Dim grey, like Pure's user@host.

[username]
show_always = true
format = "[$user@]($style)"
style_user = "bright-black"
style_root = "bold red"

[env_var.MACHINE_NAME]
format = "[$env_value]($style) "
style = "bright-black"

[hostname]
ssh_only = false
# Hidden when MACHINE_NAME names the machine instead
detect_env_vars = ["!MACHINE_NAME"]
format = "[$hostname]($style) "
style = "bright-black"

# Starship's SSH symbol, leading the line in any SSH session
[env_var.SSH_CONNECTION]
format = "🌐 "
