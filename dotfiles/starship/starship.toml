# Starship prompt config, linked to ~/.config/starship.toml by setup.sh.
# Based on the Pure preset (https://starship.rs/presets/pure-preset),
# as generated by `starship preset pure-preset` (starship 1.27.0).
# Note: the git_status and jj_status symbols below are zero-width spaces (U+200B).
#
# Changes from the preset (everything else is Pure as generated):
#   - scan_timeout
#   - format: ${env_var.SSH_CONNECTION}, ${env_var.MACHINE_NAME} and
#     ${env_var.TAILNET_HOSTNAME} added
#   - [directory]: full ~ path, repo folder in bold
#   - "🌐 user@machine ~/path  branch*", then ❯ on line 2
#   - Everforest Dark Medium colours (palette below; hex colours need a
#     truecolor terminal): user@machine blue, path aqua, git all purple
#     (all bold); the rest are Pure's colours in their Everforest versions
#   - [git_branch]: branch symbol (needs a Nerd Font)
#   - the [username], [hostname] and [env_var.*] tables at the bottom

# Top-level keys must come before any [table].
# Raised from the default 30ms to avoid "Scanning current directory timed
# out" warnings in large directories.
scan_timeout = 500

# Everforest Dark Medium (https://everforest.vercel.app/palette), defined in
# [palettes.everforest] below.
palette = "everforest"

"$schema" = 'https://starship.rs/config-schema.json'

format = """
${env_var.SSH_CONNECTION}\
$username\
${env_var.MACHINE_NAME}\
${env_var.TAILNET_HOSTNAME}\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "bold ef_aqua"
# Ours: full path from ~ (like Pure itself).
# If paths get unruly, fish_style_pwd_dir_length = 1 (and dropping the two
# truncation lines) gives ~/.h/w/d/repo instead.
truncation_length = 0
truncate_to_repo = false
before_repo_root_style = "bold ef_aqua"
repo_root_style = "bold ef_aqua"

[character]
success_symbol = "[❯](bold ef_purple)"
error_symbol = "[❯](bold ef_red)"
vimcmd_symbol = "[❮](bold ef_green)"

[git_branch]
format = "[$symbol$branch]($style)"
style = "bold ef_purple"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](bold ef_purple) ($ahead_behind$stashed)]($style)"
style = "bold ef_purple"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold ef_purple"

[cmd_duration]
format = "[$duration]($style) "
style = "bold ef_yellow"

[jj_bookmark]
format = "[$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
style = "bold ef_purple"

[jj_status]
format = "[[(*$all)](bold ef_purple)]($style)"
style = "bold ef_purple"
conflicted = "​"
description_empty = ""
description_present = ""
hidden = "​"
immutable = "​"
added = "​"
copied = ""
deleted = "​"
modified = "​"
renamed = "​"

[python]
format = "[$virtualenv]($style) "
style = "bold ef_grey1"
detect_extensions = []
detect_files = []

# --- Machine name: always show user@machine, so you know where you are ---
# The machine is the first of:
#   1. $MACHINE_NAME (export it in ~/.profile.local)
#   2. $TAILNET_HOSTNAME (the tailnet MagicDNS name, set by bashrc/zshrc,
#      which skip the lookup when MACHINE_NAME is set)
#   3. the short hostname
# Dim grey, like Pure's user@host.

[username]
show_always = true
format = "[$user@]($style)"
style_user = "bold ef_blue"
style_root = "bold ef_red"

[env_var.MACHINE_NAME]
format = "[$env_value]($style) "
style = "bold ef_blue"

[env_var.TAILNET_HOSTNAME]
format = "[$env_value]($style) "
style = "bright-black"

[hostname]
ssh_only = false
# Hidden when MACHINE_NAME or TAILNET_HOSTNAME names the machine instead
detect_env_vars = ["!MACHINE_NAME", "!TAILNET_HOSTNAME"]
format = "[$hostname]($style) "
style = "bold ef_blue"

# Starship's SSH symbol, leading the line in any SSH session
[env_var.SSH_CONNECTION]
format = "🌐 "

# --- Everforest Dark Medium palette (https://everforest.vercel.app/palette) ---
# Only the colours used above. The ef_ prefix
# keeps them from replacing the terminal's own colours.
[palettes.everforest]
ef_grey1 = "#859289"
ef_blue = "#7fbbb3"
ef_aqua = "#83c092"
ef_purple = "#d699b6"
ef_yellow = "#dbbc7f"
ef_green = "#a7c080"
ef_red = "#e67e80"
